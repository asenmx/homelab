image:
  repository: asnm/gtp-poc 
  pullPolicy: IfNotPresent
  tag: acb790ab1d87e36f9901d492062bab346a32d5d7

imagePullSecrets:
- name: regcred


service:
  type: ClusterIP
  port: 8081

httpRoute:
  enabled: true 
  annotations: {}
  parentRefs:
  - name: istio-gateway
    sectionName: http
  hostnames:
  - gtp.k8s.labz
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
livenessProbe:
  httpGet:
    path: /
    port: 8081
readinessProbe:
  httpGet:
    path: /
    port: 8081

